# Builds the workspace as a static site and publishes it on GitHub Pages at
# https://shehral.github.io/citation-equity/. In the repository settings, set
# Pages > Build and deployment > Source to "GitHub Actions".
#
# Pages serves a project site under /<repo>/, so the build sets
# NEXT_PUBLIC_BASE_PATH to that path (a fork with another name sets its own).
# The site has no server: it is the files in apps/workspace/out.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits rather than cancelling one in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pnpm 10, from the packageManager field in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/configure-pages@v6
      - name: Build the workspace
        run: pnpm --filter workspace build
        env:
          NEXT_PUBLIC_BASE_PATH: /citation-equity
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/workspace/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
